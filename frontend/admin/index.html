<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>TheNotebook — Admin</title> 

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#05070c;
    --panel:#080c14;
    --panel2:#0b1019;
    --line:#1b2637;
    --line2:#263247;
    --text:#f3f5f8;
    --muted:#68758a;
    --accent:#91b2e3;
    --danger:#c77b86;
    --success:#91c7a0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(80,125,190,.12),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   HEADER
========================= */

header{
    height:82px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
    background:rgba(5,7,12,.78);
    backdrop-filter:blur(12px);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-shape{
    position:relative;
    width:34px;
    height:34px;
}

.brand-shape span{
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    border:1px solid rgba(145,178,227,.6);
}

.brand-shape span:nth-child(1){
    top:0;
    left:7px;
}

.brand-shape span:nth-child(2){
    top:10px;
    left:0;
}

.brand-shape span:nth-child(3){
    top:10px;
    left:14px;
}

.logo{
    font-size:23px;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--accent);
}

.header-right{
    display:flex;
    align-items:center;
    gap:22px;
}

.back,
.logout{
    color:var(--muted);
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    transition:.2s ease;
}

.back:hover,
.logout:hover{
    color:var(--accent);
}

.logout{
    border:0;
    background:none;
    cursor:pointer;
}

/* =========================
   COMMON
========================= */

.eyebrow{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:5px;
    color:var(--accent);
    margin-bottom:18px;
}

label{
    display:block;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:9px;
}

input,
select,
textarea{
    width:100%;
    background:#05080e;
    color:var(--text);
    border:1px solid var(--line);
    outline:none;
    padding:15px;
    border-radius:0;
    transition:.2s ease;
}

input::placeholder,
textarea::placeholder{
    color:#3e4b60;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(145,178,227,.08);
}

button{
    -webkit-tap-highlight-color:transparent;
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:calc(100vh - 82px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.login-box{
    width:min(410px,100%);
    padding:50px 42px;
    border:1px solid var(--line);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(120,165,225,.1),
            transparent 35%
        ),
        var(--panel);
    box-shadow:0 35px 100px rgba(0,0,0,.55);
}

.login-title{
    font-size:48px;
    font-weight:400;
    letter-spacing:-4px;
    margin-bottom:38px;
}

.login-field{
    margin-bottom:20px;
}

.login-input{
    font-family:Arial,sans-serif;
    font-size:13px;
}

.login-button{
    width:100%;
    border:0;
    background:#edf1f6;
    color:#05070c;
    padding:15px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
    margin-top:8px;
    transition:.2s ease;
}

.login-button:hover{
    background:var(--accent);
}

.login-button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

#loginMessage{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:var(--danger);
    margin-top:15px;
    min-height:14px;
    line-height:1.6;
}

/* =========================
   ADMIN
========================= */

#adminScreen{
    display:none;
}

main{
    width:min(1050px,86%);
    margin:auto;
    padding:90px 0 120px;
}

.page-title{
    margin-bottom:60px;
}

.page-title h1{
    font-size:clamp(48px,7vw,78px);
    font-weight:400;
    letter-spacing:-5px;
}

.editor{
    border-top:1px solid var(--line);
    padding-top:35px;
}

.field{
    margin-bottom:30px;
}

.editor input{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

textarea{
    min-height:300px;
    resize:vertical;
    line-height:1.8;
    font-family:Arial,sans-serif;
    font-size:13px;
}

select{
    font-family:Arial,sans-serif;
    font-size:13px;
}

.actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.publish{
    width:auto;
    border:0;
    background:#edf1f6;
    color:#05070c;
    padding:15px 25px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.2s ease;
}

.publish:hover{
    background:var(--accent);
}

.publish:disabled{
    opacity:.55;
    cursor:not-allowed;
}

#message{
    font-family:Arial,sans-serif;
    font-size:10px;
    color:var(--muted);
    min-height:14px;
}

#message.success{
    color:var(--success);
}

#message.error{
    color:var(--danger);
}

/* =========================
   ENTRIES
========================= */

.entries{
    margin-top:110px;
    border-top:1px solid var(--line);
    padding-top:35px;
}

.entries-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.entries-head h2{
    font-size:25px;
    font-weight:400;
}

.count{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:var(--muted);
}

.entry{
    display:grid;
    grid-template-columns:55px 1fr auto;
    gap:20px;
    align-items:center;
    padding:25px 10px;
    border-bottom:1px solid var(--line);
    transition:.2s ease;
}

.entry:hover{
    background:
        linear-gradient(
            90deg,
            rgba(100,141,204,.045),
            transparent
        );
}

.entry-number{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#3e4b60;
    letter-spacing:2px;
}

.entry-title{
    font-size:21px;
    margin-bottom:7px;
}

.entry-meta{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    color:var(--muted);
}

.entry-actions{
    display:flex;
    gap:8px;
}

.entry-actions button{
    border:1px solid var(--line2);
    background:transparent;
    color:var(--muted);
    padding:9px 13px;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s ease;
}

.entry-actions button:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.entry-actions .delete-btn:hover{
    border-color:var(--danger);
    color:var(--danger);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(120,165,225,.09),
            transparent 35%
        ),
        var(--panel);

    border:1px solid var(--line);

    box-shadow:0 35px 100px rgba(0,0,0,.7);

    padding:35px;

    animation:modalIn .18s ease;
}

@keyframes modalIn{

    from{
        opacity:0;
        transform:translateY(8px) scale(.985);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.modal-eyebrow{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:4px;
    color:var(--accent);
    margin-bottom:12px;
}

.modal-title{
    font-size:32px;
    font-weight:400;
    letter-spacing:-2px;
    margin-bottom:25px;
}

.modal-field{
    margin-bottom:18px;
}

.modal textarea{
    min-height:220px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.modal-btn{
    padding:12px 18px;
    border:1px solid var(--line2);
    background:transparent;
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    cursor:pointer;
    transition:.2s ease;
}

.modal-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.modal-btn.primary{
    background:#edf1f6;
    border-color:#edf1f6;
    color:#05070c;
}

.modal-btn.primary:hover{
    background:var(--accent);
    border-color:var(--accent);
}

.modal-btn.danger{
    color:var(--danger);
    border-color:rgba(199,123,134,.35);
}

.modal-btn.danger:hover{
    background:rgba(199,123,134,.08);
    border-color:var(--danger);
}

.modal-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.delete-text{
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.7;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    header{
        height:70px;
        padding:0 6%;
    }

    .logo{
        font-size:20px;
    }

    .header-right{
        gap:12px;
    }

    .back,
    .logout{
        font-size:7px;
        letter-spacing:2px;
    }

    #loginScreen{
        min-height:calc(100vh - 70px);
    }

    main{
        width:88%;
        padding:65px 0 80px;
    }

    .page-title{
        margin-bottom:45px;
    }

    .page-title h1{
        letter-spacing:-4px;
    }

    .actions{
        align-items:stretch;
        flex-direction:column;
        gap:15px;
    }

    .publish{
        width:100%;
    }

    .entry{
        grid-template-columns:35px 1fr;
        gap:12px;
    }

    .entry-actions{
        grid-column:2;
    }

    .login-box{
        padding:40px 25px;
    }

    .login-title{
        font-size:42px;
    }

    .modal-box{
        padding:27px 22px;
    }

    .modal-actions{
        flex-direction:column-reverse;
    }

    .modal-btn{
        width:100%;
    }

}
</style>
</head>

</section>


<!-- =========================
     ADMIN
========================= -->

<section id="adminScreen">

    <main>

            </div>

<div class="field">

    <label for="image">

    </label>

    <input
        id="image"

    >

        id="imageStatus"

</div>

</section>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    id="editModal"
    class="modal"
    aria-hidden="true"
>

    <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
    >

        <p class="modal-eyebrow">
            EDIT ENTRY
        </p>

        <h2 class="modal-title">
            Refine.
        </h2>

        <div class="modal-field">

            <label for="editTitle">
                TITLE
            </label>

            <input
                id="editTitle"
                type="text"

            >

        </div>

        <div class="modal-field">

            <label for="editCategory">
                CATEGORY
            </label>

            <select id="editCategory">

                <option value="Journal">
                    Journal
                </option>

                <option value="Thoughts">
                    Thoughts
                </option>

                <option value="Stories">

                </option>

                    Ideas
                </option>

                <option value="Notes">
                    Notes
                </option>

            </select>

        </div>

        <div class="modal-field">

            <label for="editContent">
                CONTENT
            </label>

            <textarea
                id="editContent"
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                id="cancelEdit"
                type="button"
                class="modal-btn"
            >
                CANCEL
            </button>

            <button
                id="saveEdit"
                type="button"
                class="modal-btn primary"
            >
                SAVE CHANGES
            </button>

        </div>

    </div>

</div>


<!-- =========================
     DELETE MODAL
========================= -->

<div
    id="deleteModal"
    class="modal"
    aria-hidden="true"
>

    <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
    >

            REMOVE ENTRY
        </p>

        <h2 class="modal-title">
            Are you sure?
        </h2>

        <p
            id="deleteText"
            class="delete-text"
        >
            This entry will be permanently removed.
        </p>

        <div class="modal-actions">

            <button
                id="cancelDelete"
                type="button"
                class="modal-btn"
            >
                CANCEL
            </button>

            <button
                id="confirmDelete"
                type="button"
                class="modal-btn danger"
            >
                DELETE
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   API
========================= */

const API =
    "https://thenotebook-production-4e53.up.railway.app/api/blogs";

const LOGIN_API =
    "https://thenotebook-production-4e53.up.railway.app/api/admin/login";


/* =========================
   ELEMENTS
========================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminScreen =
    document.getElementById("adminScreen");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");

const logoutButton =
    document.getElementById("logoutButton");

const blogForm =
    document.getElementById("blogForm");

const publishButton =
    document.getElementById("publishButton");

const message =
    document.getElementById("message");

const entriesList =

    document.getElementById("entryCount");

const deleteModal =

const editTitle =

const editCategory =
    document.getElementById("editCategory");

const editContent =
    document.getElementById("editContent");

const deleteText =
    document.getElementById("deleteText");

const cancelEdit =
    document.getElementById("cancelEdit");

const saveEdit =
    document.getElementById("saveEdit");

const cancelDelete =
    document.getElementById("cancelDelete");

const confirmDelete =
    document.getElementById("confirmDelete");


let editingId = null;
let deletingId = null;


/* =========================
   TOKEN
========================= */

function getToken(){

    return localStorage.getItem(
        "thenotebook_admin_token"
    );

}


/* =========================
   AUTH HEADERS
========================= */

function authHeaders(){

    const token = getToken();

    return {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
    };

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "thenotebook_admin_token"
    );

    adminScreen.style.display = "none";
    loginScreen.style.display = "flex";

    logoutButton.style.display = "none";

    loginForm.reset();

    loginMessage.textContent = "";

}


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    loginScreen.style.display = "none";
    adminScreen.style.display = "block";

    logoutButton.style.display = "block";

    loadEntries();

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        loginMessage.textContent = "";

        if(!username || !password){

            loginMessage.textContent =
                "Please enter both fields.";

            return;

        }

        loginButton.disabled = true;
        loginButton.textContent = "ENTERING...";

        try{

            const response =
                await fetch(
                    LOGIN_API,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            username:username,
                            password:password
                        })
                    }
                );

            const text =
                await response.text();

            let data = {};

            try{

                data = JSON.parse(text);

            }catch{

                data = {};

            }

            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Invalid username or password."
                );

            }

            if(!data.token){

                throw new Error(
                    "Login succeeded but no token was received."
                );

            }

            localStorage.setItem(
                "thenotebook_admin_token",
                data.token
            );

            showAdmin();

        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            loginMessage.textContent =
                error.message ||
                "Unable to login.";

        }
        finally{

            loginButton.disabled = false;
            loginButton.textContent = "ENTER";

        }

    }
);


/* =========================
   LOGOUT BUTTON
========================= */

logoutButton.addEventListener(
    "click",
    logout
);

   PUBLISH

        const content =
            document

                .value
                .trim();

        message.className = "";

        if(!title || !content){

            message.textContent =
                "Please complete the fields.";

            message.className = "error";

            return;

        }

        publishButton.disabled = true;
        publishButton.textContent = "PUBLISHING...";
        message.textContent = "";

/* =========================
   LOAD ENTRIES
========================= */

async function loadEntries(){

    entryCount.textContent =
        "LOADING";

    try{

        const response =
            await fetch(API);

        const data =
            await response.json();

        if(!response.ok){

            throw new Error(
                "Unable to load entries."
            );

        }

        const blogs =
            Array.isArray(data)
            ? data
            : (
                data.blogs ||
                data.entries ||
                []
            );

        entriesList.innerHTML = "";

        entryCount.textContent =
            String(blogs.length).padStart(2,"0")
            +
            (
                blogs.length === 1
                ? " ENTRY"
                : " ENTRIES"
            );

        if(!blogs.length){

            entriesList.innerHTML = `
                <div style="
                    padding:30px 0;
                    color:#68758a;
                    font-family:Arial,sans-serif;
                    font-size:11px;
                ">
                    No entries yet.
                </div>
            `;

            return;

        }

        blogs.forEach(
            function(blog,index){

                const id =
                    blog.id ||
                    blog._id;

                const entry =
                    document.createElement("div");

                entry.className = "entry";

                entry.innerHTML = `

                    <div class="entry-number">
                        ${String(index + 1).padStart(2,"0")}
                    </div>

                    <div>

                        <div class="entry-title">
                            ${escapeHTML(
                                blog.title ||
                                "Untitled"
                            )}
                        </div>

                        <div class="entry-meta">
                            ${escapeHTML(
                                blog.category ||
                                "Journal"
                            )}
                        </div>

                    </div>

                    <div class="entry-actions">

                        <button
                            type="button"
                            class="edit-btn"
                        >
                            EDIT
                        </button>

                        <button
                            type="button"
                            class="delete-btn"
                        >
                            DELETE
                        </button>

                    </div>
                `;

                entry
                    .querySelector(".edit-btn")
                    .addEventListener(
                        "click",
                        function(){
                            openEdit(blog,id);
                        }
                    );

                entry
                    .querySelector(".delete-btn")
                    .addEventListener(
                        "click",
                        function(){
                            openDelete(blog,id);
                        }
                    );

                entriesList.appendChild(entry);

            }
        );

    }
    catch(error){

        console.error(
            "LOAD ERROR:",
            error
        );

        entryCount.textContent =
            "ERROR";

        entriesList.innerHTML = `
            <div style="
                padding:30px 0;
                color:#c77b86;
                font-family:Arial,sans-serif;
                font-size:11px;
            ">
                Unable to load entries.
            </div>
        `;

    }

}


/* =========================
   EDIT
========================= */

function openEdit(blog,id){

    editingId = id;

    editTitle.value =
        blog.title || "";

    editCategory.value =
        blog.category || "Journal";

    editContent.value =
        blog.content || "";

    editModal.classList.add("show");

    editModal.setAttribute(
        "aria-hidden",
        "false"
    );

    setTimeout(
        function(){
            editTitle.focus();
        },
        50
    );

}


function closeEdit(){

    editingId = null;

    editModal.classList.remove(
        "show"
    );

    editModal.setAttribute(
        "aria-hidden",
        "true"
    );

}


cancelEdit.addEventListener(
    "click",
    closeEdit
);


/* =========================
   SAVE EDIT
========================= */

saveEdit.addEventListener(
    "click",
    async function(){

        if(!editingId){
            return;
        }

        const title =
            editTitle.value.trim();

        const category =
            editCategory.value;

        const content =
            editContent.value.trim();

        if(!title || !content){

            alert(
                "Title and content are required."
            );

            return;

        }

        saveEdit.disabled = true;
        saveEdit.textContent = "SAVING...";

        try{

            const response =
                await fetch(
                    `${API}/${editingId}`,
                    {
                        method:"PUT",

                        headers:authHeaders(),

                        body:JSON.stringify({
                            title:title,
                            category:category,
                            content:content
                        })
                    }
                );

            const text =
                await response.text();

            let data = {};

            try{
                data = JSON.parse(text);
            }catch{}

            if(response.status === 401){

                closeEdit();
                logout();

                throw new Error(
                    "Your session expired. Please login again."
                );

            }

            if(!response.ok){

                throw new Error(
                    data.error ||
                    `Update failed (${response.status})`
                );

            }

            closeEdit();

            await loadEntries();

        }
        catch(error){

            console.error(
                "EDIT ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to update entry."
            );

        }
        finally{

            saveEdit.disabled = false;

            saveEdit.textContent =
                "SAVE CHANGES";

        }

    }
);


/* =========================
   DELETE
========================= */

function openDelete(blog,id){

    deletingId = id;

    deleteText.textContent =
        `"${blog.title || "Untitled"}" will be permanently removed.`;

    deleteModal.classList.add("show");

    deleteModal.setAttribute(
        "aria-hidden",
        "false"
    );

}


function closeDelete(){

    deletingId = null;

    deleteModal.classList.remove(
        "show"
    );

    deleteModal.setAttribute(
        "aria-hidden",
        "true"
    );

}


cancelDelete.addEventListener(
    "click",
    closeDelete
);


/* =========================
   CONFIRM DELETE
========================= */

confirmDelete.addEventListener(
    "click",
    async function(){

        if(!deletingId){
            return;
        }

        confirmDelete.disabled = true;
        confirmDelete.textContent =
            "DELETING...";

        try{

            const response =
                await fetch(
                    `${API}/${deletingId}`,
                    {
                        method:"DELETE",
                        headers:authHeaders()
                    }
                );

            const text =
                await response.text();

            let data = {};

            try{
                data = JSON.parse(text);
            }catch{}

            if(response.status === 401){

                closeDelete();
                logout();

                throw new Error(
                    "Your session expired. Please login again."
                );

            }

            if(!response.ok){

                throw new Error(
                    data.error ||
                    `Delete failed (${response.status})`
                );

            }

            closeDelete();

            await loadEntries();

        }
        catch(error){

            console.error(
                "DELETE ERROR:",
                error
            );

            alert(
                error.message ||
                "Unable to delete entry."
            );

        }
        finally{

            confirmDelete.disabled = false;

            confirmDelete.textContent =
                "DELETE";

        }

    }
);


/* =========================
   MODAL BACKDROP
========================= */

editModal.addEventListener(
    "click",
    function(event){

        if(event.target === editModal){
            closeEdit();
        }

    }
);


deleteModal.addEventListener(
    "click",
    function(event){

        if(event.target === deleteModal){
            closeDelete();
        }

    }
);


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Escape"){
            return;
        }

        closeEdit();
        closeDelete();

    }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    const div =
        document.createElement("div");

    div.textContent =
        value || "";

    return div.innerHTML;

}
