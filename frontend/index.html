<!DOCTYPE html>  <html lang="en">  <head>  <meta charset="UTF-8">  <meta name="viewport"  
content="width=device-width, initial-scale=1.0">

<title>TheNotebook</title>  <style>  
  
/* =========================  
   RESET  
========================= */  
  
* {  
    margin: 0;  
    padding: 0;  
    box-sizing: border-box;  
}  
  
  
html {  
    scroll-behavior: smooth;  
}  
  
  
body {  
    min-height: 100vh;  
  
    background:  
        radial-gradient(  
            circle at 78% 15%,  
            rgba(100, 141, 204, 0.07),  
            transparent 28%  
        ),  
        #05070c;  
  
    color: #f4f5f7;  
  
    font-family:  
        Georgia,  
        "Times New Roman",  
        serif;  
  
    overflow-x: hidden;  
}  
  
  
/* =========================  
   HEADER  
========================= */  
  
header {  
  
    height: 82px;  
  
    padding: 0 7%;  
  
    display: flex;  
  
    align-items: center;  
  
    justify-content: space-between;  
  
    border-bottom:  
        1px solid #192130;  
  
    position: relative;  
  
    z-index: 10;  
}  
  
  
/* BRAND */  
  
.brand {  
  
    display: flex;  
  
    align-items: center;  
  
    gap: 13px;  
}  
  
  
/* HEADER SHAPE */  
  
.brand-shape {  
  
    position: relative;  
  
    width: 34px;  
  
    height: 34px;  
  
    flex-shrink: 0;  
}  
  
  
.brand-shape span {  
  
    position: absolute;  
  
    width: 19px;  
  
    height: 19px;  
  
    border-radius: 50%;  
  
    border:  
        1px solid  
        rgba(132, 174, 229, 0.62);  
  
    background:  
        rgba(100, 141, 204, 0.07);  
  
    box-shadow:  
        0 0 20px  
        rgba(100, 141, 204, 0.08);  
  
    backdrop-filter:  
        blur(2px);  
}  
  
  
.brand-shape span:nth-child(1) {  
  
    top: 0;  
  
    left: 7px;  
}  
  
  
.brand-shape span:nth-child(2) {  
  
    top: 10px;  
  
    left: 0;  
}  
  
  
.brand-shape span:nth-child(3) {  
  
    top: 10px;  
  
    left: 14px;  
}  
  
  
/* LOGO */  
  
.logo {  
  
    font-size: 23px;  
  
    letter-spacing: -0.5px;  
}  
  
  
.logo span {  
  
    color: #91b2e3;  
}  
  
  
/* ADMIN */  
  
.admin {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 9px;  
  
    letter-spacing: 3px;  
  
    color: #68758a;  
  
    text-decoration: none;  
  
    transition: 0.3s;  
}  
  
  
.admin:hover {  
  
    color: #91b2e3;  
}  
  
  
/* =========================  
   HERO  
========================= */  
  
.hero {  
  
    min-height: 650px;  
  
    width: min(1100px, 86%);  
  
    margin: auto;  
  
    padding:  
        130px 0  
        115px;  
  
    position: relative;  
  
    display: flex;  
  
    flex-direction: column;  
  
    justify-content: center;  
  
    overflow: visible;  
}  
  
  
/* =========================  
   HERO ORBIT  
========================= */  
  
.hero-art {  
  
    position: absolute;  
  
    width: 520px;  
  
    height: 520px;  
  
    right: -70px;  
  
    top: 45px;  
  
    pointer-events: none;  
  
    opacity: 0.85;  
}  
  
  
.orbit {  
  
    position: absolute;  
  
    border-radius: 50%;  
  
    border:  
        1px solid  
        rgba(100, 141, 204, 0.13);  
  
    transform: rotate(-25deg);  
}  
  
  
.orbit.one {  
  
    width: 410px;  
  
    height: 210px;  
  
    top: 100px;  
  
    left: 55px;  
}  
  
  
.orbit.two {  
  
    width: 430px;  
  
    height: 230px;  
  
    top: 95px;  
  
    left: 40px;  
  
    transform:  
        rotate(25deg);  
}  
  
  
.orbit.three {  
  
    width: 260px;  
  
    height: 260px;  
  
    top: 80px;  
  
    left: 125px;  
  
    border-color:  
        rgba(100, 141, 204, 0.08);  
}  
  
  
/* HERO CIRCLES */  
  
.hero-circle {  
  
    position: absolute;  
  
    border-radius: 50%;  
  
    border:  
        1px solid  
        rgba(131, 173, 228, 0.35);  
  
    background:  
        rgba(100, 141, 204, 0.035);  
  
    box-shadow:  
        0 0 35px  
        rgba(100, 141, 204, 0.07);  
}  
  
  
.hero-circle.one {  
  
    width: 145px;  
  
    height: 145px;  
  
    top: 115px;  
  
    left: 170px;  
}  
  
  
.hero-circle.two {  
  
    width: 85px;  
  
    height: 85px;  
  
    top: 195px;  
  
    left: 95px;  
}  
  
  
.hero-circle.three {  
  
    width: 65px;  
  
    height: 65px;  
  
    top: 195px;  
  
    left: 330px;  
}  
  
  
/* SMALL DOT */  
  
.hero-dot {  
  
    position: absolute;  
  
    width: 6px;  
  
    height: 6px;  
  
    border-radius: 50%;  
  
    background: #91b2e3;  
  
    box-shadow:  
        0 0 18px  
        rgba(145, 178, 227, 0.6);  
  
    top: 125px;  
  
    left: 145px;  
}  
  
  
/* =========================  
   HERO CONTENT  
========================= */  
  
.hero-content {  
  
    position: relative;  
  
    z-index: 2;  
  
    max-width: 700px;  
}  
  
  
.eyebrow {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 9px;  
  
    letter-spacing: 5px;  
  
    color: #91b2e3;  
  
    margin-bottom: 30px;  
}  
  
  
.hero h1 {  
  
    font-size:  
        clamp(  
            60px,  
            10vw,  
            112px  
        );  
  
    line-height: 0.88;  
  
    font-weight: 400;  
  
    letter-spacing: -7px;  
  
    margin-bottom: 38px;  
}  
  
  
.line {  
  
    width: 58px;  
  
    height: 1px;  
  
    background: #91b2e3;  
  
    margin-bottom: 27px;  
}  
  
  
.hero-text {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 12px;  
  
    line-height: 1.8;  
  
    letter-spacing: 0.4px;  
  
    color: #68758a;  
  
    max-width: 300px;  
}  
  
  
/* =========================  
   SCROLL MARK  
========================= */  
  
.scroll {  
  
    position: absolute;  
  
    bottom: 35px;  
  
    left: 0;  
  
    display: flex;  
  
    align-items: center;  
  
    gap: 12px;  
  
    font-family: Arial, sans-serif;  
  
    font-size: 8px;  
  
    letter-spacing: 3px;  
  
    color: #3e4b60;  
}  
  
  
.scroll-line {  
  
    width: 28px;  
  
    height: 1px;  
  
    background: #3e4b60;  
}  
  
  
/* =========================  
   ENTRIES  
========================= */  
  
.entries {  
  
    width: min(1050px, 86%);  
  
    margin: auto;  
  
    padding:  
        40px 0  
        125px;  
}  
  
  
.heading {  
  
    display: flex;  
  
    align-items: center;  
  
    justify-content: space-between;  
  
    padding-bottom: 18px;  
  
    border-bottom:  
        1px solid #192130;  
}  
  
  
.heading h2 {  
  
    font-size: 25px;  
  
    font-weight: 400;  
}  
  
  
.count {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 8px;  
  
    letter-spacing: 3px;  
  
    color: #68758a;  
}  
  
  
/* =========================  
   BLOG CARDS  
========================= */  
  
.blog-list {  
  
    display: grid;  
}  
  
  
.blog-card {  
  
    display: grid;  
  
    grid-template-columns:  
        75px  
        1fr  
        25px;  
  
    gap: 25px;  
  
    padding:  
        36px 10px;  
  
    border-bottom:  
        1px solid #192130;  
  
    color: inherit;  
  
    text-decoration: none;  
  
    position: relative;  
  
    transition:  
        0.35s ease;  
}  
  
  
.blog-card::before {  
  
    content: "";  
  
    position: absolute;  
  
    left: 0;  
  
    top: 0;  
  
    width: 1px;  
  
    height: 0;  
  
    background: #91b2e3;  
  
    transition:  
        0.35s ease;  
}  
  
  
.blog-card:hover {  
  
    background:  
        linear-gradient(  
            90deg,  
            rgba(100, 141, 204, 0.045),  
            transparent  
        );  
  
    padding-left: 20px;  
}  
  
  
.blog-card:hover::before {  
  
    height: 100%;  
}  
  
  
/* NUMBER */  
  
.number {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 9px;  
  
    letter-spacing: 2px;  
  
    color: #3e4b60;  
  
    padding-top: 5px;  
}  
  
  
/* CATEGORY */  
  
.category {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 8px;  
  
    letter-spacing: 3px;  
  
    color: #91b2e3;  
  
    margin-bottom: 10px;  
}  
  
  
/* TITLE */  
  
.title {  
  
    font-size:  
        clamp(  
            25px,  
            4vw,  
            38px  
        );  
  
    font-weight: 400;  
  
    line-height: 1.1;  
  
    margin-bottom: 12px;  
}  
  
  
/* DATE */  
  
.date {  
  
    font-family: Arial, sans-serif;  
  
    font-size: 9px;  
  
    color: #58657a;  
}  
  
  
/* ARROW */  
  
.arrow {  
  
    color: #91b2e3;  
  
    font-size: 19px;  
  
    align-self: center;  
  
    transition:  
        0.3s ease;  
}  
  
  
.blog-card:hover .arrow {  
  
    transform:  
        translateX(6px);  
}  
  
  
/* =========================  
   STATUS  
========================= */  
  
.status {  
  
    padding: 60px 0;  
  
    font-family: Arial, sans-serif;  
  
    font-size: 11px;  
  
    letter-spacing: 1px;  
  
    color: #68758a;  
}  
  
  
/* =========================  
   FOOTER  
========================= */  
  
footer {  
  
    border-top:  
        1px solid #192130;  
  
    padding:  
        40px 7%;  
  
    text-align: center;  
  
    font-family: Arial, sans-serif;  
  
    font-size: 8px;  
  
    letter-spacing: 4px;  
  
    color: #3e4858;  
}  
  
  
/* =========================  
   MOBILE  
========================= */  
  
@media (max-width: 700px) {  
  
  
    header {  
  
        height: 70px;  
  
        padding: 0 6%;  
    }  
  
  
    .logo {  
  
        font-size: 20px;  
    }  
  
  
    .hero {  
  
        min-height: 620px;  
  
        padding:  
            95px 0  
            100px;  
    }  
  
  
    .hero-art {  
  
        width: 360px;  
  
        height: 360px;  
  
        right: -155px;  
  
        top: 105px;  
  
        opacity: 0.6;  
    }  
  
  
    .orbit.one {  
  
        width: 300px;  
  
        height: 155px;  
    }  
  
  
    .orbit.two {  
  
        width: 310px;  
  
        height: 165px;  
    }  
  
  
    .orbit.three {  
  
        width: 190px;  
  
        height: 190px;  
  
        left: 105px;  
    }  
  
  
    .hero-circle.one {  
  
        width: 105px;  
  
        height: 105px;  
  
        left: 135px;  
    }  
  
  
    .hero-circle.two {  
  
        width: 60px;  
  
        height: 60px;  
  
        left: 75px;  
    }  
  
  
    .hero-circle.three {  
  
        width: 48px;  
  
        height: 48px;  
  
        left: 270px;  
    }  
  
  
    .hero h1 {  
  
        font-size: 65px;  
  
        letter-spacing: -4px;  
    }  
  
  
    .scroll {  
  
        display: none;  
    }  
  
  
    .blog-card {  
  
        grid-template-columns:  
            45px  
            1fr  
            18px;  
  
        gap: 15px;  
  
        padding:  
            28px 5px;  
    }  
  
  
    .blog-card:hover {  
  
        padding-left: 10px;  
    }  
  
  
    .title {  
  
        font-size: 25px;  
    }  
  
}  
  
</style>  </head>  <body>  <!-- =========================  
     HEADER  
========================= -->  <header>  <div class="brand">  


    <div class="brand-shape">  

        <span></span>  

        <span></span>  

        <span></span>  

    </div>  


    <div class="logo">  

        The<span>Notebook</span>  

    </div>  


</div>  


<a
    href="https://the-notebook-8cvfs5axg-ace-ce61.vercel.app/"
    class="admin"
>
    ADMIN
</a>


</header>  <!-- =========================  
     HERO  
========================= -->  <section class="hero">  <!-- DECOR -->  

<div class="hero-art">  

    <div  
        class="orbit one"  
    ></div>  

    <div  
        class="orbit two"  
    ></div>  

    <div  
        class="orbit three"  
    ></div>  


    <div  
        class="hero-circle one"  
    ></div>  

    <div  
        class="hero-circle two"  
    ></div>  

    <div  
        class="hero-circle three"  
    ></div>  


    <div  
        class="hero-dot"  
    ></div>  

</div>  



<!-- CONTENT -->  

<div class="hero-content">  


    <p class="eyebrow">  
        THOUGHTS  
    </p>  


    <h1>  

        The<br>  

        Notebook.  

    </h1>  


    <div class="line"></div>  


    <p class="hero-text">  

        Words. Stories. Ideas.  

    </p>  


</div>  



<div class="scroll">  

    <span class="scroll-line"></span>  

    SCROLL  

</div>

</section>  <!-- =========================  
     ENTRIES  
========================= -->  <section class="entries">  <div class="heading">  


    <h2>  
        Entries  
    </h2>  


    <span  
        id="entryCount"  
        class="count"  
    >  
        LOADING  
    </span>  


</div>  



<div  
    id="blogList"  
    class="blog-list"  
>  


    <div class="status">  
        Opening...  
    </div>  


</div>

</section>  <!-- =========================  
     FOOTER  
========================= -->  <footer>  THE NOTEBOOK

</footer>  <script>  
  
  
const API =  
    "https://thenotebook-production-f6f5.up.railway.app/api/blogs";  
  
  
const blogList =  
    document.getElementById(  
        "blogList"  
    );  
  
  
const entryCount =  
    document.getElementById(  
        "entryCount"  
    );  
  
  
  
/* =========================  
   LOAD  
========================= */  
  
async function loadBlogs() {  
  
  
    try {  
  
  
        const response =  
            await fetch(API);  
  
  
        const blogs =  
            await response.json();  
  
  
        if (!response.ok) {  
  
            throw new Error(  
                "Unable to load."  
            );  
  
        }  
  
  
        blogList.innerHTML = "";  
  
  
        entryCount.textContent =  
            blogs.length === 1  
                ? "01 ENTRY"  
                : `${String(  
                    blogs.length  
                ).padStart(  
                    2,  
                    "0"  
                )} ENTRIES`;  
  
  
        if (  
            blogs.length === 0  
        ) {  
  
  
            blogList.innerHTML = `  
  
                <div class="status">  
  
                    Empty.  
  
                </div>  
  
            `;  
  
  
            return;  
  
        }  
  
  
        blogs.forEach(  
            (blog, index) => {  
  
  
                const card =  
                    document  
                        .createElement("a");  
  
  
                card.className =  
                    "blog-card";  
  
  
                card.href =  
                    `blog.html?id=${blog.id}`;  
  
  
                card.innerHTML = `  
  
                    <div class="number">  
  
                        ${String(  
                            index + 1  
                        ).padStart(  
                            2,  
                            "0"  
                        )}  
  
                    </div>  
  
  
                    <div>  
  
  
                        <div class="category">  
  
                            ${escapeHTML(  
                                blog.category  
                            )}  
  
                        </div>  
  
  
                        <div class="title">  
  
                            ${escapeHTML(  
                                blog.title  
                            )}  
  
                        </div>  
  
  
                        <div class="date">  
  
                            ${formatDate(  
                                blog.created_at  
                            )}  
  
                        </div>  
  
  
                    </div>  
  
  
                    <div class="arrow">  
  
                        →  
  
                    </div>  
  
                `;  
  
  
                blogList.appendChild(  
                    card  
                );  
  
            }  
        );  
  
  
    }  
  
  
    catch (error) {  
  
  
        console.error(error);  
  
  
        entryCount.textContent =  
            "OFFLINE";  
  
  
        blogList.innerHTML = `  
  
            <div class="status">  
  
                Offline.  
  
            </div>  
  
        `;  
  
    }  
  
}  
  
  
  
/* =========================  
   SECURITY  
========================= */  
  
function escapeHTML(text) {  
  
  
    const div =  
        document  
            .createElement("div");  
  
  
    div.textContent =  
        text;  
  
  
    return div.innerHTML;  
  
}  
  
  
  
/* =========================  
   DATE  
========================= */  
  
function formatDate(date) {  
  
  
    return new Date(date)  
        .toLocaleDateString(  
            undefined,  
            {  
                day: "numeric",  
                month: "long",  
                year: "numeric"  
            }  
        );  
  
}  
  
  
  
/* =========================  
   START  
========================= */  
  
loadBlogs();  
  
  
</script>  </body>  </html>
