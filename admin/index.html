<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheNotebook — Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#05070c;
    --panel:#080c14;
    --panel2:#0b1019;
    --line:#1b2637;
    --line2:#263247;
    --text:#f3f5f8;
    --muted:#68758a;
    --accent:#91b2e3;
    --danger:#c77b86;
}

body{
    min-height:100vh;
    background:
        radial-gradient(
            circle at 85% 5%,
            rgba(80,125,190,.12),
            transparent 30%
        ),
        var(--bg);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   HEADER
========================= */

header{
    height:82px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-shape{
    position:relative;
    width:34px;
    height:34px;
}

.brand-shape span{
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    border:1px solid rgba(145,178,227,.6);
}

.brand-shape span:nth-child(1){
    top:0;
    left:7px;
}

.brand-shape span:nth-child(2){
    top:10px;
    left:0;
}

.brand-shape span:nth-child(3){
    top:10px;
    left:14px;
}

.logo{
    font-size:23px;
    letter-spacing:-.5px;
}

.logo span{
    color:var(--accent);
}

.back{
    color:var(--muted);
    text-decoration:none;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
}

.back:hover{
    color:var(--accent);
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:calc(100vh - 82px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.login-box{
    width:min(410px,100%);
    padding:50px 42px;
    border:1px solid var(--line);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(120,165,225,.1),
            transparent 35%
        ),
        var(--panel);
    box-shadow:0 35px 100px rgba(0,0,0,.55);
}

.eyebrow{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:5px;
    color:var(--accent);
    margin-bottom:18px;
}

.login-title{
    font-size:48px;
    font-weight:400;
    letter-spacing:-4px;
    margin-bottom:38px;
}

.login-field{
    margin-bottom:20px;
}

label{
    display:block;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:var(--muted);
    margin-bottom:9px;
}

input,
select,
textarea{
    width:100%;
    background:#05080e;
    color:var(--text);
    border:1px solid var(--line);
    outline:none;
    padding:15px;
    transition:.2s ease;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(145,178,227,.08);
}

.login-input{
    font-family:Arial,sans-serif;
    font-size:13px;
}

.login-button,
.publish{
    width:100%;
    border:0;
    background:#edf1f6;
    color:#05070c;
    padding:15px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
    margin-top:8px;
    transition:.2s ease;
}

.login-button:hover,
.publish:hover{
    background:var(--accent);
}

.login-button:disabled,
.publish:disabled{
    opacity:.55;
    cursor:not-allowed;
}

#loginMessage{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:var(--danger);
    margin-top:15px;
    min-height:14px;
}

/* =========================
   ADMIN
========================= */

#adminScreen{
    display:none;
}

main{
    width:min(1050px,86%);
    margin:auto;
    padding:90px 0 120px;
}

.page-title{
    margin-bottom:60px;
}

.page-title h1{
    font-size:clamp(48px,7vw,78px);
    font-weight:400;
    letter-spacing:-5px;
}

.editor{
    border-top:1px solid var(--line);
    padding-top:35px;
}

.field{
    margin-bottom:30px;
}

.editor input{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

textarea{
    min-height:300px;
    resize:vertical;
    line-height:1.8;
    font-family:Arial,sans-serif;
    font-size:13px;
}

select{
    font-family:Arial,sans-serif;
    font-size:13px;
}

.actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.publish{
    width:auto;
    padding:15px 25px;
}

#message{
    font-family:Arial,sans-serif;
    font-size:10px;
    color:var(--muted);
}

/* =========================
   ENTRIES
========================= */

.entries{
    margin-top:110px;
    border-top:1px solid var(--line);
    padding-top:35px;
}

.entries-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.entries-head h2{
    font-size:25px;
    font-weight:400;
}

.count{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:var(--muted);
}

.entry{
    display:grid;
    grid-template-columns:55px 1fr auto;
    gap:20px;
    align-items:center;
    padding:25px 10px;
    border-bottom:1px solid var(--line);
    transition:.2s ease;
}

.entry:hover{
    background:
        linear-gradient(
            90deg,
            rgba(100,141,204,.045),
            transparent
        );
}

.entry-number{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#3e4b60;
    letter-spacing:2px;
}

.entry-title{
    font-size:21px;
    margin-bottom:7px;
}

.entry-meta{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    color:var(--muted);
}

.entry-actions{
    display:flex;
    gap:8px;
}

.entry-actions button{
    border:1px solid var(--line2);
    background:transparent;
    color:var(--muted);
    padding:9px 13px;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.2s ease;
}

.entry-actions button:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.entry-actions .delete-btn:hover{
    border-color:var(--danger);
    color:var(--danger);
}

/* =========================
   LOGOUT
========================= */

.logout{
    border:0;
    background:transparent;
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    cursor:pointer;
}

.logout:hover{
    color:var(--accent);
}

/* =========================
   MODALS
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:25px;

    background:rgba(0,0,0,.72);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(600px,100%);
    background:
        radial-gradient(
            circle at 90% 0%,
            rgba(120,165,225,.09),
            transparent 35%
        ),
        var(--panel);

    border:1px solid var(--line);
    box-shadow:0 35px 100px rgba(0,0,0,.7);

    padding:35px;
    animation:modalIn .18s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(8px) scale(.985);
    }

    to{
        opacity:1;
        transform:none;
    }
}

.modal-eyebrow{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:4px;
    color:var(--accent);
    margin-bottom:12px;
}

.modal-title{
    font-size:32px;
    font-weight:400;
    letter-spacing:-2px;
    margin-bottom:25px;
}

.modal-field{
    margin-bottom:18px;
}

.modal textarea{
    min-height:220px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:25px;
}

.modal-btn{
    padding:12px 18px;
    border:1px solid var(--line2);
    background:transparent;
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    cursor:pointer;
}

.modal-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
}

.modal-btn.primary{
    background:#edf1f6;
    border-color:#edf1f6;
    color:#05070c;
}

.modal-btn.primary:hover{
    background:var(--accent);
    border-color:var(--accent);
}

.modal-btn.danger{
    color:var(--danger);
    border-color:rgba(199,123,134,.35);
}

.modal-btn.danger:hover{
    background:rgba(199,123,134,.08);
    border-color:var(--danger);
}

.delete-text{
    color:var(--muted);
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.7;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    header{
        height:70px;
        padding:0 6%;
    }

    .logo{
        font-size:20px;
    }

    #loginScreen{
        min-height:calc(100vh - 70px);
    }

    main{
        width:88%;
        padding:65px 0 80px;
    }

    .actions{
        align-items:stretch;
        flex-direction:column;
        gap:15px;
    }

    .publish{
        width:100%;
    }

    .entry{
        grid-template-columns:35px 1fr;
        gap:12px;
    }

    .entry-actions{
        grid-column:2;
    }

    .login-box{
        padding:40px 25px;
    }

    .modal-box{
        padding:27px 22px;
    }

    .modal-actions{
        flex-direction:column-reverse;
    }

    .modal-btn{
        width:100%;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">

        <div class="brand-shape">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="logo">
            The<span>Notebook</span>
        </div>

    </div>

    <div>
        <a
            href="https://the-notebook-taupe.vercel.app/"
            class="back"
            target="_blank"
            rel="noopener"
        >
            + SITE
        </a>
    </div>

</header>


<!-- =========================
     LOGIN SCREEN
========================= -->

<section id="loginScreen">

    <form id="loginForm" class="login-box">

        <p class="eyebrow">
            THE NOTEBOOK
        </p>

        <h1 class="login-title">
            Welcome.
        </h1>

        <div class="login-field">

            <label for="username">
                USERNAME
            </label>

            <input
                id="username"
                class="login-input"
                type="text"
                autocomplete="username"
                placeholder="Username"
                required
            >

        </div>

        <div class="login-field">

            <label for="password">
                PASSWORD
            </label>

            <input
                id="password"
                class="login-input"
                type="password"
                autocomplete="current-password"
                placeholder="Password"
                required
            >

        </div>

        <button
            id="loginButton"
            class="login-button"
            type="submit"
        >
            ENTER
        </button>

        <p id="loginMessage"></p>

    </form>

</section>


<!-- =========================
     ADMIN SCREEN
========================= -->

<section id="adminScreen">

    <main>

        <section class="page-title">

            <p class="eyebrow">
                ADMIN
            </p>

            <h1>
                Compose.
            </h1>

        </section>


        <form id="blogForm" class="editor">

            <div class="field">

                <label for="title">
                    TITLE
                </label>

                <input
                    id="title"
                    type="text"
                    placeholder="Title"
                    required
                >

            </div>


            <div class="field">

                <label for="category">
                    CATEGORY
                </label>

                <select id="category">

                    <option value="Journal">
                        Journal
                    </option>

                    <option value="Thoughts">
                        Thoughts
                    </option>

                    <option value="Stories">
                        Stories
                    </option>

                    <option value="Ideas">
                        Ideas
                    </option>

                    <option value="Notes">
                        Notes
                    </option>

                </select>

            </div>


            <div class="field">

                <label for="content">
                    CONTENT
                </label>

                <textarea
                    id="content"
                    placeholder="Write..."
                    required
                ></textarea>

            </div>


            <div class="actions">

                <button
                    id="publishButton"
                    type="submit"
                    class="publish"
                >
                    PUBLISH
                </button>

                <div id="message"></div>

            </div>

        </form>


        <section class="entries">

            <div class="entries-head">

                <h2>
                    Entries
                </h2>

                <span
                    id="entryCount"
                    class="count"
                >
                    LOADING
                </span>

            </div>

            <div id="entriesList"></div>

        </section>

    </main>

</section>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    id="editModal"
    class="modal"
    aria-hidden="true"
>

    <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
    >

        <p class="modal-eyebrow">
            EDIT ENTRY
        </p>

        <h2 class="modal-title">
            Refine.
        </h2>

        <div class="modal-field">

            <label for="editTitle">
                TITLE
            </label>

            <input
                id="editTitle"
                type="text"
            >

        </div>

        <div class="modal-field">

            <label for="editContent">
                CONTENT
            </label>

            <textarea
                id="editContent"
            ></textarea>

        </div>

        <div class="modal-actions">

            <button
                id="cancelEdit"
                type="button"
                class="modal-btn"
            >
                CANCEL
            </button>

            <button
                id="saveEdit"
                type="button"
                class="modal-btn primary"
            >
                SAVE CHANGES
            </button>

        </div>

    </div>

</div>


<!-- =========================
     DELETE MODAL
========================= -->

<div
    id="deleteModal"
    class="modal"
    aria-hidden="true"
>

    <div
        class="modal-box"
        role="dialog"
        aria-modal="true"
    >

        <p class="modal-eyebrow">
            REMOVE ENTRY
        </p>

        <h2 class="modal-title">
            Are you sure?
        </h2>

        <p
            id="deleteText"
            class="delete-text"
        >
            This entry will be permanently removed.
        </p>

        <div class="modal-actions">

            <button
                id="cancelDelete"
                type="button"
                class="modal-btn"
            >
                CANCEL
            </button>

            <button
                id="confirmDelete"
                type="button"
                class="modal-btn danger"
            >
                DELETE
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   API
========================= */

const API =
    "https://thenotebook-production-fa3e.up.railway.app/api/blogs";

const LOGIN_API =
    "https://thenotebook-production-fa3e.up.railway.app/api/admin/login";


/* =========================
   ELEMENTS
========================= */

const loginScreen =
    document.getElementById("loginScreen");

const adminScreen =
    document.getElementById("adminScreen");

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginMessage =
    document.getElementById("loginMessage");

const blogForm =
    document.getElementById("blogForm");

const publishButton =
    document.getElementById("publishButton");

const message =
    document.getElementById("message");

const entriesList =
    document.getElementById("entriesList");

const entryCount =
    document.getElementById("entryCount");

const editModal =
    document.getElementById("editModal");

const deleteModal =
    document.getElementById("deleteModal");

const editTitle =
    document.getElementById("editTitle");

const editContent =
    document.getElementById("editContent");

const deleteText =
    document.getElementById("deleteText");

const cancelEdit =
    document.getElementById("cancelEdit");

const saveEdit =
    document.getElementById("saveEdit");

const cancelDelete =
    document.getElementById("cancelDelete");

const confirmDelete =
    document.getElementById("confirmDelete");


let editingId = null;
let deletingId = null;


/* =========================
   TOKEN
========================= */

function getToken(){

    return localStorage.getItem(
        "thenotebook_admin_token"
    );

}


/* =========================
   AUTH HEADERS
========================= */

function authHeaders(){

    const token = getToken();

    return {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
    };

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        loginMessage.textContent = "";

        if(!username || !password){

            loginMessage.textContent =
                "Please enter both fields.";

            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "ENTERING...";

        try{

            const response =
                await fetch(
                    LOGIN_API,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            username:username,
                            password:password
                        })
                    }
                );


            let data = {};

            try{
                data = await response.json();
            }
            catch{
                data = {};
            }


            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Invalid username or password."
                );

            }


            if(!data.token){

                throw new Error(
                    "Login succeeded but no token was received."
                );

            }


            localStorage.setItem(
                "thenotebook_admin_token",
                data.token
            );


            loginMessage.textContent = "";

            showAdmin();

        }
        catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );

            loginMessage.textContent =
                error.message ||
                "Unable to login.";

        }
        finally{

            loginButton.disabled = false;
            loginButton.textContent = "ENTER";
        }
        }
        );
