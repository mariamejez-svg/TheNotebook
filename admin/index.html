<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TheNotebook — Admin</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 85% 5%, rgba(80,125,190,.12), transparent 30%),
        #05070c;
    color:#f3f5f8;
    font-family:Georgia,"Times New Roman",serif;
}

/* =========================
   HEADER
========================= */

header{
    height:82px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #192130;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-shape{
    position:relative;
    width:34px;
    height:34px;
}

.brand-shape span{
    position:absolute;
    width:19px;
    height:19px;
    border-radius:50%;
    border:1px solid rgba(145,178,227,.6);
}

.brand-shape span:nth-child(1){
    top:0;
    left:7px;
}

.brand-shape span:nth-child(2){
    top:10px;
    left:0;
}

.brand-shape span:nth-child(3){
    top:10px;
    left:14px;
}

.logo{
    font-size:23px;
    letter-spacing:-.5px;
}

.logo span{
    color:#91b2e3;
}

.header-right{
    display:flex;
    align-items:center;
    gap:25px;
}

.back,
.logout{
    color:#68758a;
    text-decoration:none;
    background:none;
    border:0;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
}

.back:hover,
.logout:hover{
    color:#91b2e3;
}

/* =========================
   COMMON
========================= */

.eyebrow{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:5px;
    color:#91b2e3;
    margin-bottom:18px;
}

label{
    display:block;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:#68758a;
    margin-bottom:10px;
}

input,
select,
textarea{
    width:100%;
    background:#05080e;
    color:#f4f5f7;
    border:1px solid #1b2637;
    outline:none;
    padding:15px;
    border-radius:0;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#91b2e3;
    box-shadow:0 0 0 1px rgba(145,178,227,.08);
}

/* =========================
   LOGIN
========================= */

#loginScreen{
    min-height:calc(100vh - 82px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:35px 20px;
}

.login-box{
    position:relative;
    width:min(410px,100%);
    padding:52px 42px;
    background:
        radial-gradient(circle at 90% 0%,rgba(120,165,225,.10),transparent 35%),
        #080c14;
    border:1px solid #1b2637;
    box-shadow:0 35px 100px rgba(0,0,0,.55);
}

.login-box::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px solid rgba(145,178,227,.035);
    pointer-events:none;
}

.login-title{
    font-size:50px;
    font-weight:400;
    letter-spacing:-4px;
    margin-bottom:40px;
}

.login-field{
    margin-bottom:21px;
}

.login-input{
    font-family:Arial,sans-serif;
    font-size:13px;
}

.login-button{
    width:100%;
    border:0;
    background:#edf1f6;
    color:#05070c;
    padding:15px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
    margin-top:8px;
    transition:.25s;
}

.login-button:hover{
    background:#91b2e3;
}

.login-button:disabled{
    opacity:.55;
    cursor:wait;
}

#loginMessage{
    min-height:16px;
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#a66d7b;
    margin-top:15px;
}

/* =========================
   ADMIN
========================= */

#adminScreen{
    display:none;
}

main{
    width:min(1050px,86%);
    margin:auto;
    padding:90px 0 120px;
}

.page-title{
    margin-bottom:60px;
}

h1{
    font-size:clamp(48px,7vw,78px);
    font-weight:400;
    letter-spacing:-5px;
}

.editor{
    border-top:1px solid #192130;
    padding-top:35px;
}

.field{
    margin-bottom:30px;
}

input{
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px;
}

select,
textarea{
    font-family:Arial,sans-serif;
    font-size:13px;
}

textarea{
    min-height:300px;
    resize:vertical;
    line-height:1.8;
}

.actions{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.publish{
    border:0;
    background:#edf1f6;
    color:#05070c;
    padding:15px 25px;
    font-family:Arial,sans-serif;
    font-size:9px;
    letter-spacing:3px;
    cursor:pointer;
    transition:.25s;
}

.publish:hover{
    background:#91b2e3;
}

.publish:disabled{
    opacity:.55;
    cursor:wait;
}

#message{
    font-family:Arial,sans-serif;
    font-size:10px;
    color:#68758a;
}

/* =========================
   ENTRIES
========================= */

.entries{
    margin-top:110px;
    border-top:1px solid #192130;
    padding-top:35px;
}

.entries-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.entries-head h2{
    font-size:25px;
    font-weight:400;
}

.count{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:3px;
    color:#68758a;
}

.entry{
    display:grid;
    grid-template-columns:55px 1fr auto;
    gap:20px;
    align-items:center;
    padding:25px 10px;
    border-bottom:1px solid #192130;
    transition:.3s;
}

.entry:hover{
    background:linear-gradient(
        90deg,
        rgba(100,141,204,.045),
        transparent
    );
}

.entry-number{
    font-family:Arial,sans-serif;
    font-size:9px;
    color:#3e4b60;
    letter-spacing:2px;
}

.entry-title{
    font-size:21px;
    margin-bottom:7px;
}

.entry-meta{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;
    color:#68758a;
}

.entry-actions{
    display:flex;
    gap:8px;
}

.entry-actions button{
    border:1px solid #263247;
    background:transparent;
    color:#68758a;
    padding:9px 13px;
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:1px;
    cursor:pointer;
    transition:.25s;
}

.entry-actions button:hover{
    border-color:#91b2e3;
    color:#91b2e3;
}

/* =========================
   CUSTOM MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    z-index:9999;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(2,4,9,.84);

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.modal.show{
    display:flex;
}

.modal-card{
    position:relative;

    width:min(760px,100%);
    max-height:90vh;

    overflow:auto;

    padding:52px 55px 45px;

    background:
        radial-gradient(
            circle at 90% 5%,
            rgba(120,165,225,.13),
            transparent 28%
        ),
        #080c14;

    border:1px solid #29384d;

    box-shadow:
        0 40px 120px rgba(0,0,0,.75);

    animation:modalAppear .28s ease;
}

@keyframes modalAppear{
    from{
        opacity:0;
        transform:translateY(18px) scale(.98);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Decorative circles */

.modal-decoration{
    position:absolute;
    top:20px;
    right:25px;
    width:110px;
    height:110px;
    pointer-events:none;
}

.circle{
    position:absolute;
    border:1px solid rgba(145,178,227,.16);
    border-radius:50%;
}

.circle.one{
    width:100px;
    height:45px;
    top:25px;
    left:5px;
    transform:rotate(-30deg);
}

.circle.two{
    width:100px;
    height:45px;
    top:25px;
    left:5px;
    transform:rotate(30deg);
}

.circle.three{
    width:55px;
    height:55px;
    top:20px;
    left:28px;
}

.modal-top{
    display:flex;
    justify-content:space-between;

    padding-bottom:20px;
    margin-bottom:35px;

    border-bottom:1px solid #1c2839;
}

.modal-label{
    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:4px;
    color:#91b2e3;
}

.modal-number{
    font-family:Arial,sans-serif;
    font-size:8px;
    color:#46536a;
    letter-spacing:2px;
}

.modal-title{
    font-size:clamp(42px,6vw,65px);
    font-weight:400;
    letter-spacing:-4px;
    margin-bottom:12px;
}

.modal-subtitle{
    font-family:Arial,sans-serif;
    font-size:10px;
    color:#68758a;
    margin-bottom:35px;
}

.modal-field{
    margin-bottom:25px;
}

.modal-field input,
.modal-field textarea{
    background:#05080e;
    border:1px solid #1d2a3c;
}

.modal-field input{
    font-family:Georgia,"Times New Roman",serif;
    font-size:21px;
}

.modal-field textarea{
    min-height:220px;
    font-family:Georgia,"Times New Roman",serif;
    font-size:15px;
    line-height:1.8;
}

.modal-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;

    padding-top:25px;
    margin-top:30px;

    border-top:1px solid #1c2839;
}

.modal-note{
    font-family:Arial,sans-serif;
    font-size:8px;
    line-height:1.7;
    letter-spacing:1px;
    color:#46536a;
}

.modal-buttons{
    display:flex;
    gap:9px;
}

.modal-btn{
    min-width:95px;

    padding:13px 18px;

    border:1px solid #29374c;
    background:transparent;

    color:#718096;

    font-family:Arial,sans-serif;
    font-size:8px;
    letter-spacing:2px;

    cursor:pointer;
    transition:.25s;
}

.modal-btn:hover{
    border-color:#91b2e3;
    color:#91b2e3;
}

.modal-btn.primary{
    background:#edf1f6;
    color:#05070c;
    border-color:#edf1f6;
}

.modal-btn.primary:hover{
    background:#91b2e3;
    border-color:#91b2e3;
}

/* DELETE MODAL */

.delete-card{
    width:min(450px,100%);
    text-align:center;
}

.delete-card .modal-title{
    margin-top:20px;
}

.delete-text{
    font-family:Arial,sans-serif;
    color:#68758a;
    font-size:12px;
    line-height:1.7;
    margin-bottom:25px;
}

.delete-card .modal-buttons{
    justify-content:center;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    header{
        height:70px;
        padding:0 6%;
    }

    .logo{
        font-size:20px;
    }

    .header-right{
        gap:12px;
    }

    .back{
        font-size:8px;
    }

    .logout{
        font-size:8px;
    }

    #loginScreen{
        min-height:calc(100vh - 70px);
        padding:25px 18px;
    }

    .login-box{
        padding:40px 25px;
    }

    .login-title{
        font-size:43px;
    }

    main{
        width:88%;
        padding:65px 0 80px;
    }

    .actions{
        align-items:flex-start;
        flex-direction:column;
        gap:15px;
    }

    .publish{
        width:100%;
    }

    .entry{
        grid-template-columns:35px 1fr;
        gap:12px;
    }

    .entry-actions{
        grid-column:2;
    }

    .modal-card{
        padding:35px 22px 30px;
    }

    .modal-decoration{
        transform:scale(.7);
        right:5px;
        top:5px;
    }

    .modal-footer{
        align-items:flex-start;
        flex-direction:column;
    }

    .modal-buttons{
        width:100%;
    }

    .modal-btn{
        flex:1;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

<div class="brand">

<div class="brand-shape">
<span></span>
<span></span>
<span></span>
</div>

<div class="logo">
The<span>Notebook</span>
</div>

</div>

<div class="header-right">

<a
href="https://the-notebook-taupe.vercel.app/"
class="back"
target="_blank"
>
+ SITE
</a>

<button
id="logoutButton"
class="logout"
type="button"
style="display:none;"
>
LOGOUT
</button>

</div>

</header>


<!-- =========================
     LOGIN
========================= -->

<section id="loginScreen">

<div class="login-box">

<p class="eyebrow">
THE NOTEBOOK
</p>

<h1 class="login-title">
Welcome.
</h1>

<form id="loginForm">

<div class="login-field">

<label>
USERNAME
</label>

<input
id="username"
class="login-input"
type="text"
autocomplete="username"
placeholder="Username"
required
>

</div>

<div class="login-field">

<label>
PASSWORD
</label>

<input
id="password"
class="login-input"
type="password"
autocomplete="current-password"
placeholder="Password"
required
>

<button
id="loginButton"
class="login-button"
type="submit"
>
ENTER

<p id="loginMessage"></p>

</div>

<!-- =========================
     ADMIN
========================= -->

<section id="adminScreen">

<main>

<section class="page-title">

<p class="eyebrow">
ADMIN
</p>

<h1>
Compose.
</h1>

</section>


<form
id="blogForm"
class="editor"
>

<div class="field">

<label>
TITLE

>

<div class="field">

<select id="category">

Journal

<!-- =========================
     EDIT MODAL
========================= -->

<div

>

TITLE

>

CONTENT

></textarea>

for better words.

id="saveEdit"

SAVE

</div>

</div>

</div>


<!-- =========================
     DELETE MODAL
========================= -->

<div
id="deleteModal"
class="modal"
>

<div class="modal-card delete-card">

<p class="modal-label">
REMOVE
</p>

<h2 class="modal-title">
Let go?
</h2>

<p class="delete-text">
This entry will leave the notebook.
</p>

<div class="modal-buttons">

<button
type="button"
class="modal-btn"
id="cancelDelete"
>
KEEP
</button>

<button
type="button"
class="modal-btn primary"
id="confirmDelete"
>
REMOVE
</button>

</div>

</div>

</div>


<script>

/* =========================
   API
========================= */

const API =
"https://thenotebook-production-fa3e.up.railway.app/api/blogs";

const LOGIN_API =
"https://thenotebook-production-fa3e.up.railway.app/api/admin/login";


/* =========================
   ELEMENTS
========================= */

const loginScreen =
document.getElementById("loginScreen");

const adminScreen =
document.getElementById("adminScreen");

const loginForm =
document.getElementById("loginForm");

const loginButton =
document.getElementById("loginButton");

const loginMessage =
document.getElementById("loginMessage");

const logoutButton =
document.getElementById("logoutButton");

const blogForm =
document.getElementById("blogForm");

const publishButton =
document.getElementById("publishButton");

const message =
document.getElementById("message");

const entriesList =
document.getElementById("entriesList");

const entryCount =
document.getElementById("entryCount");

const editModal =
document.getElementById("editModal");

const deleteModal =
document.getElementById("deleteModal");

const editTitle =
document.getElementById("editTitle");

const editContent =
document.getElementById("editContent");

const editNumber =
document.getElementById("editNumber");

let editingId = null;
let deletingId = null;


/* =========================
   TOKEN
========================= */

function getToken(){

    return localStorage.getItem(
        "thenotebook_admin_token"
    );

}


/* =========================
   AUTH HEADERS
========================= */

function authHeaders(){

    const token = getToken();

    return {
        "Content-Type":"application/json",
        "Authorization":"Bearer " + token
    };

}


/* =========================
   LOGIN
========================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        const username =
            document.getElementById(
                "username"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        if(!username || !password){

            loginMessage.textContent =
                "Please enter both fields.";

            return;
        }

        loginButton.disabled = true;

        loginButton.textContent =
            "ENTERING...";

        loginMessage.textContent = "";

        try{

            const response =
                await fetch(
                    LOGIN_API,
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:JSON.stringify({
                            username,
                            password
                        })
                    }
                );

            let data = {};

            try{
                data =
                    await response.json();
            }
            catch{
                data = {};
            }

            if(!response.ok){

                throw new Error(
                    data.error ||
                    "Login failed."
                );

            }

            if(!data.token){

                throw new Error(
                    "No login token received."
                );

            }

            localStorage.setItem(
                "thenotebook_admin_token",
                data.token
            );

            document.getElementById(
                "password"
            ).value = "";

            showAdmin();

        }
        catch(error){

            console.error(
                "Login error:",
                error
            );

            loginMessage.textContent =
                error.message ===
                "Failed to fetch"
                ? "Unable to connect to server."
                : "Invalid username or password.";

        }
        finally{

            loginButton.disabled = false;

            loginButton.textContent =
                "ENTER";

        }

    }
);


/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

    loginScreen.style.display =
        "none";

    adminScreen.style.display =
        "block";

    logoutButton.style.display =
        "block";

    loadEntries();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "thenotebook_admin_token"
    );

    adminScreen.style.display =
        "none";

    loginScreen.style.display =
        "flex";

    logoutButton.style.display =
        "none";

    document.getElementById(
        "password"
    ).value = "";

    loginMessage.textContent = "";

}

logoutButton.addEventListener(
    "click",
    logout
);


/* =========================
   PUBLISH
========================= */

blogForm.addEventListen
